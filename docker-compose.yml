services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # Uncomment the next two lines on networks where apt HTTPS is intercepted:
      # args:
      #   APT_PROTOCOL: http
    # Load the developer .env (contains GOOGLE_API_KEY, CORS_ORIGINS, etc.).
    # No secrets appear in this file.
    env_file:
      - ./backend/.env
    # Override Windows-specific paths that are set in the local .env.
    # Inside the Docker image, Tesseract is on PATH and tessdata is at the
    # default system location, so both values must be blank.
    environment:
      TESSERACT_CMD: ""
      TESSDATA_PREFIX: ""
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
